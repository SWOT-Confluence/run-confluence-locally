
# The run will be created at: <root_dir>/confluence_<run_name>/
root_dir: "/fs/ess/PAS1926/2026confluence/OSP"
run_name: "OSP_1"

roi_file: "/users/PAS1926/scoss/VersionDconf/Fork/run-confluence-locally/willamette_roi.json"

#priors_zenodo_doi: "10.5281/zenodo.20541765"
priors_bind_dir: "/fs/ess/PAS1926/2026confluence/SVSfull/confluence_svs_full/svs_full_mnt/input/sos"
#sword_zenodo_doi: "10.5281/zenodo.15299138" #this is for b!
#sword_zenodo_doi: "10.5281/zenodo.21415370"
sword_bind_dir: "/fs/ess/PAS1926/2026confluence/SVSfull/confluence_svs_full_c/svs_full_c_mnt/input/sword"
svs_repo_filename: "SVS_v1_1_2.nc" #"SVS_v1_0_1.nc"
#swot_input_bind_dir: "/fs/ess/PAS1926/2026confluence/SVSfull/confluence_svs_full/svs_full_mnt/input/swot"

default_github_username: "SWOT-Confluence"
default_repository_branch: "main" # Can also be per-module in `repo_branches`
default_image_release_tag: 4.0.0

submit_driver: True

clone_repos: True
rebuild_all_modules: False

modules_to_run:
  - "expanded_setfinder"
  - "expanded_combine_data"
  - "input"
  - "non_expanded_setfinder"
  - "non_expanded_combine_data"
  - "prediagnostics"
  - "metroman"
  - "metroman_consolidation"
  - "unconstrained_momma"
  - "busboi"
  #- "hivdi"
  - "sic4dvar"
  - "consensus"
  - "moi"
  - "offline"
  - "validation"
  - "output"

repo_branches:
  setfinder: "tedlanghorst:main"
  busboi: "BUSBOI_main"
  momma: "post_UAT"
  validation: "Test_offline"
  offline: "26update"
  input: "h_break_bugfix"
  moi: "MOI_5_test"
  output: "add_offline_valid_back"

hpc:
  partition: "cpu"
  account: "PAS1926"
  time: "1-00:00:00"
  batch_size: 1000
  concurrent_jobs: 400
  reach_chunks: 20


# Really a module argument but so many of them use it we spec it once.
# Must always be the same for each module too.
sword_version: "17"


module_templates:
  expanded_setfinder:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/setfinder.sh.j2"
    module_args: 
      reach_file: "-r reaches_of_interest.json"
      expanded: True

  non_expanded_setfinder:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/setfinder.sh.j2"
    module_args:
      reach_file: "-r expanded_reaches_of_interest.json"
      expanded: False

  expanded_combine_data:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/combine_data.sh.j2"
    module_args:
      expanded: True

  non_expanded_combine_data:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/combine_data.sh.j2"
    module_args:
      expanded: False

  input:
    time: "24:00:00"
    mem: "4G"
    j2_file: "modules/input.sh.j2"
    module_args:
      collection: "SWOT_L2_HR_RiverSP_D"
      time_range: "&start_time=2020-09-01T00:00:00Z&end_time=2026-12-30T00:00:00Z&"
      continue_downloads: True

  prediagnostics:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/prediagnostics.sh.j2"

  hivdi:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/hivdi.sh.j2"

  busboi:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/busboi.sh.j2"

  sic4dvar:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/sic4dvar.sh.j2"
    module_args:
      config_file: "sic4dvar_param_confluence.ini"

  metroman:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/metroman.sh.j2"

  metroman_consolidation:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/metroman_consolidation.sh.j2"

  unconstrained_momma:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/momma.sh.j2"
    module_args:
      m_parameter: 3
      constrained: False

  constrained_momma:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/momma.sh.j2"
    module_args:
      m_parameter: 3
      constrained: True

  sad:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/sad.sh.j2"

  moi:
    time: "12:00:00"
    mem: "16G"
    j2_file: "modules/moi.sh.j2"
    module_args:
        basin_type: "constrained"
        svs_filename: "SVS_v1_1_2.nc"
        svs_reach_id_col: "reach_id_v17c"
        #calval_csv: "/nas/cee-water/cjgleason/Yushan/Confluence_Aug/reference/moi-gage-correlation/CalValSeparation_basin_stratified_v2.csv"
        correlation_rho: 0.20
        bias_prior_std: 0.50

  consensus:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/consensus.sh.j2"

  offline:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/offline.sh.j2"

  validation:
    time: "06:00:00"
    mem: "4G"
    j2_file: "modules/validation.sh.j2"

  output:
    time: "05:00:00"
    mem: "8G"
    j2_file: "modules/output.sh.j2"
    module_args: 
      groups: "input momma metroman sic4dvar hivdi busboi consensus moi swot validation"
